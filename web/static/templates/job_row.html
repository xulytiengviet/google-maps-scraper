<tr>
    <td><code>{{.ID}}</code></td>
    <td>{{.Name}}</td>
    <td>{{.Date}}</td>
    <td>
        <span class="status-indicator status-{{.Status}}">{{.Status}}</span>
    </td>
    <td>
        <div class="job-actions">
        {{ if eq .Status "ok" }}
            <button hx-get="/view?id={{.ID}}"
                    hx-target="#map-modal-container"
                    hx-swap="innerHTML"
                    class="view-button">Map</button>
            <a href="/export?id={{.ID}}&format=csv" download class="button download-button">CSV</a>
            <a href="/export?id={{.ID}}&format=json" download class="button export-button">JSON</a>
            <a href="/export?id={{.ID}}&format=geojson" download class="button export-button">GeoJSON</a>
        {{ end }}
        <button hx-delete="/delete?id={{.ID}}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Xóa tác vụ này?"
                class="delete-button">Xóa</button>
        </div>
    </td>
</tr>
